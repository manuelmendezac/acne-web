    <circle cx="60" cy="96" r="10" fill="#d8b4fe" opacity="0.55"/>
    <circle cx="96" cy="96" r="13" fill="#ffffff"/>
    <circle cx="132" cy="96" r="10" fill="#d8b4fe" opacity="0.55"/>
    <circle cx="60" cy="132" r="10" fill="#d8b4fe" opacity="0.55"/>
    <circle cx="96" cy="132" r="10" fill="#d8b4fe" opacity="0.55"/>
    <circle cx="132" cy="132" r="13" fill="#ffffff"/>
